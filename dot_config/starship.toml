"$schema" = 'https://starship.rs/config-schema.json'

format = "${custom.su_user}$directory$git_branch$git_state$git_status$nodejs$python$rust$bun$character"

add_newline = false

scan_timeout = 30
command_timeout = 1000

palette = "main"

[palettes.main]
info = "67"     # directory, languages, normal prompt
ok = "107"      # git normal states
alert = "167"   # errors, in-progress git operations

# =========================================================
# IDENTITY (shown only when root, or after su/sudo -i)
# =========================================================

[custom.su_user]
description = "Show username only when root or switched away from the login user"
command = "id -un"
when = '[ "$(id -u)" -eq 0 ] || [ "$(id -un)" != "${LOGNAME:-$(id -un)}" ]'
shell = ["sh"]
style = "fg:alert"
format = '[\[$output\]]($style)'
os = "unix"

# =========================================================
# DIRECTORY
# =========================================================

[directory]
style = "fg:info"
format = '[\[$path\]]($style)'

truncation_length = 3
truncation_symbol = "../"

# =========================================================
# GIT
# =========================================================

[git_branch]
symbol = "🌱 "
style = "fg:ok"
format = '[\[$symbol$branch\]]($style)'

[git_state]
style = "fg:alert"
format = '[\[$state( $progress_current/$progress_total)\]]($style)'

[git_status]
style = "fg:ok"
format = '([\[$all_status$ahead_behind\]]($style))'
conflicted = "="
ahead = "⇡${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
behind = "⇣${count}"
up_to_date = ""
untracked = "?"
stashed = '\$'
modified = "!"
staged = "+"
renamed = "»"
deleted = "x"

# =========================================================
# LANGUAGES
# =========================================================

[nodejs]
symbol = "[⬢](bold green) "
style = "fg:info"
format = '[\[$symbol$version\]]($style)'
detect_files = ["package.json", ".node-version", ".nvmrc"]
detect_folders = []
detect_extensions = []

[python]
symbol = "🐍 "
style = "fg:info"
format = '[\[$symbol$version( $virtualenv)\]]($style)'

[rust]
symbol = "🦀 "
style = "fg:info"
format = '[\[$symbol$version\]]($style)'

[bun]
symbol = "🥟 "
style = "fg:info"
format = '[\[$symbol$version\]]($style)'

# =========================================================
# CHARACTER
# =========================================================

[character]
success_symbol = '[>](fg:info)'
error_symbol = '[>](fg:alert)'
vimcmd_symbol = '[<](fg:ok)'
