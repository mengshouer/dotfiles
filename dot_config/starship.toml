"$schema" = 'https://starship.rs/config-schema.json'

format = "$username$directory$git_branch$git_state$git_status$nodejs$python$golang$rust$java$bun$jobs$cmd_duration$character"

add_newline = false

scan_timeout = 30
command_timeout = 1000

palette = "main"

[palettes.main]
info = "67"     # directory, languages, normal prompt
ok = "107"      # git normal states
alert = "167"   # errors, root, read-only, in-progress git operations

# =========================================================
# IDENTITY
# =========================================================

[username]
style_user = "fg:info"
style_root = "fg:alert"
format = '[\[$user\]]($style)'
show_always = false

# =========================================================
# DIRECTORY
# =========================================================

[directory]
style = "fg:info"
format = '[\[$path\]]($style)[(\[$read_only\])]($read_only_style)'
read_only = "RO"
read_only_style = "fg:alert"

truncation_length = 3
truncation_symbol = "../"

# =========================================================
# GIT
# =========================================================

[git_branch]
symbol = "🌱 "
style = "fg:ok"
format = '[\[$symbol$branch\]]($style)'

[git_state]
style = "fg:alert"
format = '[\[$state( $progress_current/$progress_total)\]]($style)'

[git_status]
style = "fg:ok"
format = '([\[$all_status$ahead_behind\]]($style))'
conflicted = "="
ahead = "⇡${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
behind = "⇣${count}"
up_to_date = ""
untracked = "?"
stashed = '\$'
modified = "!"
staged = "+"
renamed = "r"
deleted = "x"

# =========================================================
# LANGUAGES
# =========================================================

[nodejs]
symbol = "[⬢](bold green) "
style = "fg:info"
format = '[\[$symbol$version\]]($style)'
detect_files = ["package.json", ".node-version", ".nvmrc"]
detect_folders = []
detect_extensions = []

[python]
symbol = "🐍 "
style = "fg:info"
format = '[\[$symbol$version( $virtualenv)\]]($style)'
detect_folders = []

[golang]
symbol = "🐹 "
style = "fg:info"
format = '[\[$symbol$version\]]($style)'
detect_folders = []

[rust]
symbol = "🦀 "
style = "fg:info"
format = '[\[$symbol$version\]]($style)'
detect_folders = []

[java]
symbol = "☕ "
style = "fg:info"
format = '[\[$symbol$version\]]($style)'
detect_folders = []

[bun]
symbol = "🥟 "
style = "fg:info"
format = '[\[$symbol$version\]]($style)'
detect_folders = []

# =========================================================
# JOBS & DURATION
# =========================================================

[jobs]
symbol = "&"
style = "fg:alert"
number_threshold = 1
symbol_threshold = 1
format = '[\[$symbol$number\]]($style)'

[cmd_duration]
min_time = 5_000
style = "fg:info"
format = '[\[$duration\]]($style)'

# =========================================================
# CHARACTER
# =========================================================

[character]
success_symbol = '[>](fg:info)'
error_symbol = '[>](fg:alert)'
vimcmd_symbol = '[<](fg:ok)'
